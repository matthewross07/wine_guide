<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cellar Book</title>
  <meta name="description" content="A map of the cellar, a tasting journal, and notes on every bottle.">
  <meta name="theme-color" content="#100c0e">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%238e2236'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23d4b071'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="masthead wrap">
    <a class="brand" href="./">
      <svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true">
        <circle cx="20" cy="20" r="18" fill="url(#g-red)" stroke="rgba(0,0,0,.5)"/>
        <circle cx="20" cy="20" r="7" fill="rgba(0,0,0,.35)"/>
        <ellipse cx="13" cy="12" rx="5" ry="2.6" fill="rgba(255,255,255,.28)" transform="rotate(-35 13 12)"/>
      </svg>
      <span>
        <span class="brand-name">Cellar Book</span>
        <span class="brand-sub" id="sync-status">Opening the cellar…</span>
      </span>
    </a>
    <nav class="tabs" aria-label="Views">
      <button data-view="cellar" aria-current="page">Cellar map</button>
      <button data-view="collection">Collection</button>
      <button data-view="journal">Journal</button>
    </nav>
    <button class="icon-btn" id="settings-btn" aria-label="Settings and sync" title="Settings and sync">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7Zm7.43-2.53c.04-.32.07-.64.07-.97s-.03-.66-.07-.98l2.11-1.65a.5.5 0 0 0 .12-.64l-2-3.46a.5.5 0 0 0-.61-.22l-2.49 1a7.3 7.3 0 0 0-1.69-.98l-.38-2.65A.49.49 0 0 0 14 2h-4a.49.49 0 0 0-.49.42l-.38 2.65c-.61.25-1.17.59-1.69.98l-2.49-1a.5.5 0 0 0-.61.22l-2 3.46a.49.49 0 0 0 .12.64l2.11 1.65c-.04.32-.07.65-.07.98s.03.66.07.98l-2.11 1.65a.5.5 0 0 0-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1c.52.4 1.08.73 1.69.98l.38 2.65c.03.24.24.42.49.42h4c.25 0 .46-.18.49-.42l.38-2.65a7.7 7.7 0 0 0 1.69-.98l2.49 1c.23.09.49 0 .61-.22l2-3.46a.5.5 0 0 0-.12-.64l-2.11-1.65Z"/></svg>
    </button>
  </header>

  <section class="stats wrap" id="stats" aria-label="Collection summary"></section>

  <section class="toolbar wrap" aria-label="Find wine">
    <label class="search">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5Zm-6 0a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9Z"/></svg>
      <input id="q" type="search" autocomplete="off" placeholder="Find a wine, region, grape — or dinner (try “lamb”)">
      <kbd>/</kbd>
    </label>
    <div class="chips" id="type-chips" role="group" aria-label="Wine type"></div>
    <label class="toggle" title="At or past its best year"><input type="checkbox" id="drink-now"><span>Drink now</span></label>
    <button class="ghost-btn" id="surprise">Pick for tonight</button>
  </section>

  <main class="wrap">
    <section id="view-cellar" class="view" aria-label="Cellar map"></section>
    <section id="view-collection" class="view" aria-label="Collection" hidden></section>
    <section id="view-journal" class="view" aria-label="Journal" hidden></section>
  </main>

  <footer class="wrap foot">
    <span>Cellar Book · data lives in <a id="sheet-link" target="_blank" rel="noopener">your Google Sheet</a></span>
  </footer>

  <div class="scrim" id="scrim" hidden></div>
  <aside class="drawer" id="drawer" aria-label="Wine details" hidden></aside>
  <div class="tooltip" id="tooltip" role="tooltip" hidden></div>
  <div class="placing-banner" id="placing-banner" hidden></div>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <dialog id="dialog"></dialog>

  <!-- Shared gradients for bottle drawings -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <radialGradient id="g-red" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#b5465c"/><stop offset=".45" stop-color="#6a1325"/><stop offset="1" stop-color="#2a0710"/></radialGradient>
      <radialGradient id="g-white" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#fbf0bf"/><stop offset=".5" stop-color="#d2b160"/><stop offset="1" stop-color="#6e5419"/></radialGradient>
      <radialGradient id="g-rose" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#ffd8cd"/><stop offset=".5" stop-color="#e2867a"/><stop offset="1" stop-color="#7d3330"/></radialGradient>
      <radialGradient id="g-sparkling" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#3f4a2f"/><stop offset=".6" stop-color="#1f2618"/><stop offset="1" stop-color="#0c0f09"/></radialGradient>
      <radialGradient id="g-sparkling-rose" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#f3b7ab"/><stop offset=".55" stop-color="#b8675f"/><stop offset="1" stop-color="#5a2422"/></radialGradient>
      <radialGradient id="g-sparkling-red" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#a23a59"/><stop offset=".5" stop-color="#5a1030"/><stop offset="1" stop-color="#220512"/></radialGradient>
      <radialGradient id="g-other" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#7f4675"/><stop offset=".5" stop-color="#3b1437"/><stop offset="1" stop-color="#160616"/></radialGradient>
      <linearGradient id="g-steel" x1="0" x2="1"><stop offset="0" stop-color="#55585e"/><stop offset=".5" stop-color="#2b2d31"/><stop offset="1" stop-color="#4b4e54"/></linearGradient>
      <linearGradient id="g-glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1c2533"/><stop offset=".25" stop-color="#11151d"/><stop offset="1" stop-color="#0b0c10"/></linearGradient>
      <linearGradient id="g-wood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a7764a"/><stop offset="1" stop-color="#5e3b20"/></linearGradient>
      <linearGradient id="g-bamboo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e3c48e"/><stop offset=".6" stop-color="#c19a5e"/><stop offset="1" stop-color="#8e6a37"/></linearGradient>
      <linearGradient id="g-kraft" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b48a5a"/><stop offset="1" stop-color="#8a6438"/></linearGradient>
      <radialGradient id="g-led" cx="50%" cy="0%" r="80%"><stop offset="0" stop-color="rgba(190,215,255,.35)"/><stop offset="1" stop-color="rgba(190,215,255,0)"/></radialGradient>
    </defs>
  </svg>
</body>
</html>

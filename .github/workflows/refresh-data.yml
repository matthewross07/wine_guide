# Keeps the Explore data current without anyone running scripts:
#  - monthly: adds the newest growing-season weather to data/climate/*.json
#  - whenever data/places.src.json changes: re-resolves places, then fetches
#    climate for any new region
name: Refresh region data

on:
  schedule:
    - cron: '17 6 3 * *' # 06:17 UTC on the 3rd of each month
  push:
    branches: [main]
    paths: ['data/places.src.json']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve places (geocode new tour stops, fetch new outlines)
        run: node scripts/build-places.mjs
      - name: Fetch missing growing-season weather
        run: node scripts/build-climate.mjs
      - name: Commit changes
        if: always() # keep partial progress even if a step failed
        run: |
          if [ -n "$(git status --porcelain data)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data
            git commit -m "Refresh region data ($(date -u +%Y-%m-%d))"
            git push
          else
            echo "No changes"
          fi
